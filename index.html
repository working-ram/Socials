<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ram</title>
  <style>
    :root{
      --bg1:#0a0a0c;--bg2:#111113;
      --white:#f2f4f6;--gray:#8a8f96;--gray-dark:#3a3d42;
      --accent-r:#ff6ea0;--accent-b:#3aa6ff;
      --core-2:rgba(220,220,226,0.55);
    }
    *{box-sizing:border-box}
    html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
    html,body{height:100%;margin:0;background:#000;color:var(--white);overflow-x:hidden;font-family:system-ui,Arial,sans-serif}

    /* ---------- background video ---------- */
    .video-wrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
    #bgVideo{position:absolute;top:50%;left:50%;min-width:100%;min-height:100%;width:auto;height:auto;
      transform:translate(-50%,-50%) scale(1.02);filter:blur(2px) brightness(0.75);
      opacity:0;transition:opacity 1.2s ease;object-fit:cover}
    .video-wrap.on #bgVideo{opacity:1}
    .video-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.45) 68%, rgba(0,0,0,0.7) 100%);
      opacity:0;transition:opacity 1.2s ease}
    .video-overlay.on{opacity:1}

    /* ---------- intro / start screen ---------- */
    .intro{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
      background:#000;transition:opacity .9s ease, visibility .9s ease}
    .intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .intro-frame{position:relative;padding:2px}
    .intro-frame::before,.intro-frame::after{content:"";position:absolute;width:18px;height:18px;border-color:var(--gray);border-style:solid;opacity:.7}
    .intro-frame::before{top:-14px;left:-14px;border-width:1px 0 0 1px}
    .intro-frame::after{bottom:-14px;right:-14px;border-width:0 1px 1px 0}
    #startBtn{
      font-family:ui-monospace,monospace;font-size:15px;letter-spacing:6px;
      color:var(--white);background:transparent;border:1px solid rgba(230,230,235,0.35);
      padding:18px 34px;cursor:pointer;text-transform:uppercase;position:relative;
      transition:letter-spacing .35s ease, background .35s ease, color .35s ease, box-shadow .35s ease;
    }
    #startBtn:hover{letter-spacing:9px;background:rgba(255,255,255,0.06);box-shadow:0 0 22px rgba(255,255,255,0.12)}
    #startBtn:active{background:rgba(255,255,255,0.14)}
    .intro-sub{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;
      font-family:ui-monospace,monospace;font-size:10px;letter-spacing:3px;color:var(--gray);opacity:.7;
      animation:blink 1.6s steps(2) infinite}
    @keyframes blink{0%,100%{opacity:.7}50%{opacity:.15}}

    .toplink{position:fixed;left:16px;top:12px;z-index:120}
    .toplink a{color:#d9dde2;text-decoration:none;font-size:13px;letter-spacing:1px;font-family:ui-monospace,monospace}
    .toplink img{height:34px;vertical-align:middle;margin-right:8px;border-radius:6px}

    /* ---------- social buttons ---------- */
    .socials{position:fixed;left:16px;bottom:16px;z-index:120;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
    .social-btn{
      font-family:ui-monospace,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;
      color:var(--white);text-decoration:none;border:1px solid rgba(230,230,235,0.35);
      padding:10px 16px;background:rgba(255,255,255,0.02);
      transition:letter-spacing .3s ease,background .3s ease,border-color .3s ease;
    }
    .social-btn:hover{letter-spacing:3px;background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.7)}
    @media (max-width:520px){.socials{bottom:10px;left:10px}.social-btn{padding:8px 12px;font-size:10px}}

    .stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}

    .bg-scan{position:fixed;inset:0;z-index:22;pointer-events:none;
      background-image:linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size:100% 6px;mix-blend-mode:overlay;opacity:0.06}

    .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;height:260px;border-radius:50%;
      background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.08) 10%, rgba(230,230,235,0.04) 40%, transparent 70%),
                 radial-gradient(circle at 35% 30%, var(--core-2) 0%, rgba(220,220,226,0.02) 40%, transparent 75%);
      box-shadow:0 0 90px rgba(255,255,255,0.03),0 0 24px rgba(200,200,205,0.02) inset;z-index:5;animation:corePulse 5s ease-in-out infinite}
    .protons{position:absolute;inset:0;border-radius:50%;pointer-events:none}
    .proton-wrap{position:absolute;left:50%;top:50%;transform-origin:center;}
    .proton{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(245,245,247,0.7) 40%, rgba(220,220,225,0.2) 100%);border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,0.9),0 0 18px rgba(220,220,226,0.12)}
    .proton.p2{width:8px;height:8px;margin:-4px 0 0 -4px;background:radial-gradient(circle, rgba(240,240,242,0.95) 0%, rgba(230,230,235,0.6) 40%)}
    .proton.p3{width:6px;height:6px;margin:-3px 0 0 -3px;background:radial-gradient(circle, rgba(235,235,238,0.95) 0%, rgba(225,225,230,0.6) 40%)}
    .orbit1{width:220px;height:220px;margin-left:-110px;margin-top:-110px;animation:spin 14s linear infinite}
    .orbit2{width:160px;height:160px;margin-left:-80px;margin-top:-80px;animation:spin 9s linear reverse infinite}
    .orbit3{width:100px;height:100px;margin-left:-50px;margin-top:-50px;animation:spin 6s linear infinite}
    .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 20px rgba(255,255,255,0.02) inset;pointer-events:none}
    .ring.r1{width:420px;height:420px;border:1px solid rgba(255,255,255,0.05)}
    .ring.r2{width:340px;height:340px;border:1px solid rgba(255,255,255,0.03)}
    /* ---------- scroll-snap sections ---------- */
    .sections{position:relative;z-index:10}
    .snap-section{min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always;
      display:flex;align-items:center;justify-content:center;position:relative}

    .center{position:relative;z-index:10;font-size:56px}
    .name{background:linear-gradient(90deg,#f6f7f8,#dfe6ea);-webkit-background-clip:text;background-clip:text;color:transparent;filter:brightness(0.98);letter-spacing:2px}
    @keyframes corePulse{0%{transform:translate(-50%,-50%) scale(0.99)}50%{transform:translate(-50%,-50%) scale(1.02)}100%{transform:translate(-50%,-50%) scale(0.99)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    /* ---------- static card: plain vertical rectangle, white border, blurred backdrop ---------- */
    .card{position:absolute;left:32px;top:50%;transform:translateY(-50%);width:280px;height:380px;
      overflow:hidden;z-index:70;pointer-events:none;
      border:2px solid rgba(255,255,255,0.9);
      background:rgba(8,8,10,0.55);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 30px 80px rgba(0,0,0,0.5)}
    .card-front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
    .card-img{display:block;width:auto;height:100%;max-width:100%;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.4));object-fit:contain}
    @media (max-width:640px){
      .card{
        left:50%;top:76px;transform:translateX(-50%);
        width:56vw;max-width:230px;height:34vh;max-height:290px;
      }
      #heroSection{align-items:flex-start}
      .center{
        margin-top:calc(76px + 34vh + 28px);
        font-size:clamp(26px,7vw,34px);text-align:center;padding-left:16px;padding-right:16px;
      }
    }

    /* ---------- discord card (second slide) ---------- */
    .discord-card{
      display:flex;align-items:center;gap:22px;
      border:2px solid rgba(255,255,255,0.9);
      background:rgba(8,8,10,0.6);
      padding:26px 34px;max-width:min(86vw,420px);
      box-shadow:0 30px 80px rgba(0,0,0,0.5)}
    .discord-avatar{width:88px;height:88px;min-width:88px;border-radius:50%;object-fit:cover;
      border:2px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.05)}
    .discord-info{display:flex;flex-direction:column;gap:6px;font-family:ui-monospace,monospace;min-width:0}
    .discord-displayname{font-size:20px;font-weight:600;letter-spacing:0.5px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .discord-username{font-size:13px;letter-spacing:0.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .discord-status{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-top:2px}
    .status-dot{width:9px;height:9px;min-width:9px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
    .status-dot.online{background:#3ba55c;color:#3ba55c}
    .status-dot.idle{background:#faa61a;color:#faa61a}
    .status-dot.dnd{background:#ed4245;color:#ed4245}
    .status-dot.offline{background:#80848e;color:#80848e}
    .discord-msg-btn{
      margin-top:10px;align-self:flex-start;
      font-family:ui-monospace,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;
      color:var(--white);text-decoration:none;border:1px solid rgba(230,230,235,0.4);
      padding:8px 14px;background:rgba(255,255,255,0.03);pointer-events:auto;
      transition:letter-spacing .3s ease,background .3s ease,border-color .3s ease;
    }
    .discord-msg-btn:hover{letter-spacing:3px;background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.7)}
    @media (max-width:520px){
      .discord-card{flex-direction:column;text-align:center;padding:24px}
      .discord-displayname,.discord-username{white-space:normal}
      .discord-msg-btn{align-self:center}
    }

    .bg-strong-noise{position:fixed;inset:0;z-index:21;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,0.02) 0 1px, transparent 2px);opacity:0.025;mix-blend-mode:overlay}
  </style>
</head>
<body>

  <!-- start / intro screen -->
  <div class="intro" id="intro">
    <div class="intro-frame">
      <button id="startBtn">Link Start</button>
      <div class="intro-sub">[ press to connect ]</div>
    </div>
  </div>

  <!-- background video: preloads in the background (preload=auto), only starts playing on the button click -->
  <div class="video-wrap" id="videoWrap">
    <video id="bgVideo" muted loop playsinline preload="auto">
      <source src="Assets/just%20a%20freak.mp4" type="video/mp4">
    </video>
  </div>
  <div class="video-overlay" id="videoOverlay"></div>

  <div class="toplink">
    <a href="https://working-ram.github.io/Socials/"><img src="Assets/Ram_Icon.png" alt="Ram"></a>
    <a href="https://working-ram.github.io/Socials/">Working Ram</a>
  </div>

  <div class="socials">
    <a class="social-btn" href="https://www.roblox.com/users/1307480512/profile" target="_blank" rel="noopener noreferrer">Roblox</a>
    <a class="social-btn" href="https://www.tiktok.com/@lider_ram" target="_blank" rel="noopener noreferrer">TikTok</a>
    <a class="social-btn" href="https://www.youtube.com/channel/UCKB0qujr2UYf0vBLeFjNpPg" target="_blank" rel="noopener noreferrer">YouTube</a>
  </div>

  <div class="stage">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="core">
      <div class="protons">
        <div class="proton-wrap orbit1"><div class="proton p1" style="transform:translateX(110px)"></div></div>
        <div class="proton-wrap orbit2"><div class="proton p2" style="transform:translateX(80px)"></div></div>
        <div class="proton-wrap orbit3"><div class="proton p3" style="transform:translateX(50px)"></div></div>
        <div class="proton-wrap orbit1" style="animation-duration:18s;"><div class="proton p2" style="transform:translateX(-95px)"></div></div>
        <div class="proton-wrap orbit2" style="animation-duration:11s;"><div class="proton p3" style="transform:translateX(-65px)"></div></div>
      </div>
    </div>
  </div>

  <div class="sections">
    <!-- PART 1: hero -->
    <section class="snap-section" id="heroSection">
      <div class="center"><span class="name">Working Ram</span></div>

      <!-- static character card -->
      <div class="card" id="ramCard" aria-hidden="false">
        <div class="card-front">
          <img src="Assets/Ram_Art_Transparent.png" alt="Ram" class="card-img" decoding="async" loading="lazy">
        </div>
      </div>
    </section>

    <!-- PART 2: discord (auto-updates live via the Lanyard API) -->
    <section class="snap-section" id="discordSection">
      <div class="discord-card">
        <img class="discord-avatar" id="discordAvatar" src="" alt="Discord avatar">
        <div class="discord-info">
          <div class="discord-displayname" id="discordDisplayName">Loading...</div>
          <div class="discord-username" id="discordUsername">@—</div>
          <div class="discord-status"><span class="status-dot offline" id="statusDot"></span><span id="discordStatusText">—</span></div>
          <a class="discord-msg-btn" id="discordMsgBtn" href="#" target="_blank" rel="noopener noreferrer">Ram's Discord profile</a>
        </div>
      </div>
    </section>
  </div>

  <div class="bg-scan"></div>
  <div class="bg-strong-noise"></div>

  <script>
    (function(){
      /* ---------- intro / start button -> video ---------- */
      const intro = document.getElementById('intro');
      const startBtn = document.getElementById('startBtn');
      const video = document.getElementById('bgVideo');
      const videoWrap = document.getElementById('videoWrap');
      const videoOverlay = document.getElementById('videoOverlay');

      // Diagnostics: if the video fails to load, this logs why in the console (F12) -
      // file not found, unsupported format, etc.
      video.addEventListener('error', function(){
        const err = video.error;
        console.error('[bgVideo] failed to load. Check that "Assets/just a freak.mp4" exists with that EXACT name (matching case).', err);
      });
      video.addEventListener('loadeddata', function(){
        console.log('[bgVideo] loaded successfully.');
      });

      // The <video preload="auto"> tag already starts buffering the file as soon as the
      // page loads, so by the time the user clicks "Link Start" it should have little
      // to no delay — but playback itself only starts on the click below.

      startBtn.addEventListener('click', function(){
        intro.classList.add('hidden');
        video.muted = false;
        video.volume = 0.2;
        video.play().catch(function(e){
          console.warn('[bgVideo] play() with audio was blocked by the browser, retrying muted:', e);
          video.muted = true;
          video.play().catch(function(e2){ console.error('[bgVideo] could not play muted either:', e2); });
        });
        videoWrap.classList.add('on');
        videoOverlay.classList.add('on');
      }, {once:true});

      /* ---------- discord presence, live via the Lanyard API ---------- */
      // 1) Join https://discord.gg/lanyard (only once, with your Discord account)
      // 2) Put your Discord user ID here (Developer Mode -> right-click your profile -> Copy User ID)
      const DISCORD_ID = '781172416218136577';

      const discordAvatar = document.getElementById('discordAvatar');
      const discordDisplayName = document.getElementById('discordDisplayName');
      const discordUsername = document.getElementById('discordUsername');
      const statusDot = document.getElementById('statusDot');
      const discordStatusText = document.getElementById('discordStatusText');
      const discordMsgBtn = document.getElementById('discordMsgBtn');
      discordMsgBtn.href = `https://discord.com/users/${DISCORD_ID}`;

      const STATUS_LABELS = {online:'Online', idle:'Idle', dnd:'Do Not Disturb', offline:'Offline'};

      async function updateDiscordCard(){
        if(!DISCORD_ID) return;
        try{
          const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
          const json = await res.json();
          if(!json.success) return;
          const d = json.data;
          const user = d.discord_user;

          discordAvatar.src = `https://api.lanyard.rest/${DISCORD_ID}.png`;
          discordDisplayName.textContent = user.global_name || user.username;
          discordUsername.textContent = '@' + user.username;

          statusDot.className = 'status-dot ' + (d.discord_status || 'offline');

          const customStatus = (d.activities || []).find(a => a.type === 4);
          discordStatusText.textContent = (customStatus && customStatus.state)
            ? customStatus.state
            : (STATUS_LABELS[d.discord_status] || d.discord_status);
        }catch(e){
          console.error('[lanyard] could not fetch Discord status:', e);
        }
      }
      updateDiscordCard();
      setInterval(updateDiscordCard, 20000);

      /* ---------- a single scroll/swipe advances a whole section ---------- */
      const sections = Array.from(document.querySelectorAll('.snap-section'));
      let currentIndex = 0;
      let isAnimating = false;

      function goToSection(index){
        index = Math.max(0, Math.min(sections.length - 1, index));
        if(index === currentIndex || isAnimating) return;
        isAnimating = true;
        currentIndex = index;
        sections[index].scrollIntoView({behavior:'smooth', block:'start'});
        setTimeout(function(){ isAnimating = false; }, 700);
      }

      window.addEventListener('wheel', function(e){
        if(isAnimating){ e.preventDefault(); return; }
        if(Math.abs(e.deltaY) < 4) return;
        e.preventDefault();
        goToSection(currentIndex + (e.deltaY > 0 ? 1 : -1));
      }, {passive:false});

      let touchStartY = null;
      window.addEventListener('touchstart', function(e){
        touchStartY = e.touches[0].clientY;
      }, {passive:true});
      window.addEventListener('touchend', function(e){
        if(touchStartY === null || isAnimating) return;
        const deltaY = touchStartY - e.changedTouches[0].clientY;
        touchStartY = null;
        if(Math.abs(deltaY) < 40) return;
        goToSection(currentIndex + (deltaY > 0 ? 1 : -1));
      }, {passive:true});

    })();
  </script>
</body>
</html>
